[package]
name = "ironterm-studio"
version = "0.10.0"
description = "Offline-first integrated development environment for IBM i"
authors = ["Alexandre Bencz"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/bencz/DSPF-RAD"
build = "build.rs"

[lib]
name = "ironterm_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dirs = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
ssh2 = { version = "=0.9.6", features = ["vendored-openssl"] }
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.25.0", features = ["v4"] }
zeroize = "=1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"
