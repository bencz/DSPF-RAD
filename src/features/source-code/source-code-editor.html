<section class="source-code-surface" id="sourceCodeSurface" hidden>
    <div class="source-code-tabs" id="sourceCodeTabs" role="tablist"
         aria-label="Open source documents"></div>
    <div class="source-code-toolbar">
        <span class="source-code-language" id="sourceCodeLanguage">Plain Text</span>
        <span class="source-code-resource" id="sourceCodeResource"></span>
        <span class="source-code-toolbar-spacer"></span>
        <button type="button" id="sourceCodeSave">Save</button>
        <button type="button" id="sourceCodeClose">Close</button>
    </div>
    <div class="source-code-editor-host" id="sourceCodeEditorHost"></div>
</section>
