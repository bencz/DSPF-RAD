<section class="window project-explorer" aria-labelledby="projectExplorerTitle">
    <div class="title-bar inactive project-explorer-titlebar">
        <div class="title-bar-text" id="projectExplorerTitle">Project Explorer</div>
    </div>
    <div class="project-explorer-toolbar" role="toolbar" aria-label="Project actions">
        <button type="button" data-command="workspace.new" title="New workspace"
                aria-label="New workspace">New</button>
        <button type="button" data-command="workspace.open" title="Open workspace"
                aria-label="Open workspace">Open</button>
        <button type="button" data-command="source.openLocal" title="Open IBM i source"
                aria-label="Open IBM i source">Source</button>
    </div>
    <div class="project-explorer-tree" id="projectExplorerTree"
         role="tree" aria-label="Workspace projects and source files"></div>
    <div class="project-explorer-summary" id="projectExplorerSummary"></div>
</section>
