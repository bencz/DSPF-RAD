openapi: 3.1.0
info:
  title: DSPF·RAD Seed-Data Demo API
  version: 2.0.0
  description: >
    Seed-data demo server for generated React apps. Serves deterministic
    seeded screen state and scripted demo transactions. This server is a
    fixture server: every response carries mode=seed-demo, and it provides
    no session, authorization, idempotency, or audit enforcement.
    Markdown SSOT: contract/04-seed-backend.md.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read service health and mode
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /screens/{screenName}:
    parameters:
      - $ref: '#/components/parameters/ScreenName'
    get:
      operationId: getScreenSeed
      summary: Read the seeded state of one screen
      responses:
        '200':
          description: Seeded screen state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenState'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /transaction:
    post:
      operationId: submitDemoTransaction
      summary: Submit an AID and field payload; receive the next scripted screen state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Next seeded screen state (transition matched or stayed on screen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    ScreenName:
      name: screenName
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request shape
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Field validation against seed metadata failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Screen or resource does not exist
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Requested screen revision is unknown to the seed set
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServerError:
      description: Unexpected server error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Health:
      type: object
      required: [status, mode]
      properties:
        status: { type: string, enum: [ok, degraded] }
        mode: { type: string, enum: [seed-demo] }
    ScreenState:
      type: object
      required: [mode, screen, revision, modelKey, record, fields]
      properties:
        mode: { type: string, enum: [seed-demo] }
        screen: { type: string }
        revision: { type: string }
        modelKey: { type: string, enum: [24x80, 27x132] }
        record: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldState' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        subfiles: { type: object, additionalProperties: true }
        cursor: { $ref: '#/components/schemas/Cursor' }
    FieldState:
      type: object
      required: [runtimeBindingKey, domId, value, usage]
      properties:
        runtimeBindingKey: { type: string }
        domId: { type: string }
        value: {}
        usage: { type: string, enum: [I, O, B, H, P, M] }
        readOnly: { type: boolean }
        mask: { type: boolean }
    Message:
      type: object
      required: [severity, text]
      properties:
        severity: { type: string, enum: [info, warning, error] }
        text: { type: string }
        sourceIdentity: { type: [string, 'null'] }
    Action:
      type: object
      required: [id, kind, enabled]
      properties:
        id: { type: string }
        kind: { type: string, enum: [aid, command, function-key] }
        enabled: { type: boolean }
        destructive: { type: boolean }
    Cursor:
      type: object
      properties:
        field: { type: [string, 'null'] }
        row: { type: [integer, 'null'] }
        col: { type: [integer, 'null'] }
    TransactionRequest:
      type: object
      required: [screen, screenRevision, aid, fields]
      properties:
        screen: { type: string }
        screenRevision: { type: string }
        aid: { $ref: '#/components/schemas/Aid' }
        fields: { type: object, additionalProperties: true }
        cursor: { $ref: '#/components/schemas/Cursor' }
        subfiles: { type: object, additionalProperties: true }
    Aid:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        number: { type: [integer, 'null'] }
    TransactionResponse:
      type: object
      required: [mode, screen, screenRevision, messages, fieldValues, indicators, subfiles, nextActions]
      properties:
        mode: { type: string, enum: [seed-demo] }
        screen: { type: string }
        screenRevision: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        fieldValues: { type: object, additionalProperties: true }
        indicators: { type: object, additionalProperties: { type: boolean } }
        cursor: { $ref: '#/components/schemas/Cursor' }
        subfiles: { type: object, additionalProperties: true }
        nextActions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object, additionalProperties: true } }
